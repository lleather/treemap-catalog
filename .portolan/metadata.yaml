title: "TreeMap"
description: >-
  TreeMap provides 30-meter forest attribute rasters for the forested extent
  of the conterminous United States. This catalog contains the 2016, 2020,
  2022, and 2023 vintages as annual items with separate attribute COG assets.
contact:
  name: "TreeMap Help"
  email: "sm.fs.treemaphelp@usda.gov"
license: "other"
license_url: "https://www.fs.usda.gov/rds/archive/catalog/RDS-2025-0032"
providers:
  - name: "USDA Forest Service"
    roles: ["producer", "licensor"]
    url: "https://data.fs.usda.gov/geodata/rastergateway/treemap/"
  - name: "RedCastle Resources"
    roles: ["processor", "host"]
