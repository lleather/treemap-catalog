title: "TreeMap"
description: >-
  TreeMap provides 30-meter forest attribute rasters for the forested extent
  of the conterminous United States. This initial publication contains the
  2023 vintage with 22 separate attribute COG assets and its Raster Attribute
  Table in CSV and Parquet. A collection-level CSV provides the attribute
  data dictionary.
