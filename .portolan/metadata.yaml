processing_notes: >-
  The source is the GTAC separated-attribute raster delivery. The 2020 and
  2022 assets come from the 2026_UPDATE delivery. The 2023 assets come from
  the final-zone-imputation production rerun. The 2016 assets use the default
  annual directory. The ingest checks each TIFF for COG compliance. It copies
  compliant COGs unchanged and converts failed checks locally with GDAL. It
  validates each output before it writes the file to the dedicated network COG
  delivery. The source was inventoried on 2026-10-06. See AGENTS.md for annual
  schema notes and reproducible commands. The 2023 Raster Attribute Table is
  copied unchanged from the GTAC reference-data delivery. A Parquet derivative
  supports direct remote queries. The attribute data dictionary CSV is a
  normalized export of the source workbook reviewed on February 25, 2026.
known_issues: >-
  TM_ID values are specific to each TreeMap vintage. Do not use the 2023 Raster
  Attribute Table with another year. Earlier TreeMap vintages are not part of
  this initial 2023 publication.
