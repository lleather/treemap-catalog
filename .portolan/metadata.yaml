  - "carbon"
  - "conterminous United States"
  - "forest inventory"
  - "forest type"
  - "TreeMap"
attribution: >-
  USDA Forest Service TreeMap. Cite each vintage used in a publication,
  presentation, or other research product.
processing_notes: >-
  The source is the GTAC separated-attribute raster delivery. The 2020 and
  2022 assets come from the 2026_UPDATE delivery. The 2023 assets come from
  the final-zone-imputation production rerun. The 2016 assets use the default
  annual directory. The ingest checks each TIFF for COG compliance. It copies
  compliant COGs unchanged and converts failed checks locally with GDAL. It
  validates each output before it writes the file to the dedicated network COG
  delivery. The source was inventoried on 2026-10-06. See AGENTS.md for annual
  schema notes and reproducible commands.
known_issues: >-
  TM_ID values map to FIA PLT_CN through a year-specific Raster Attribute
  Table that this first publication does not include. The 2016 source calls
  this raster VALUE; the catalog publishes it as TM_ID. QMD_RMRS and
  SDIPCT_RMRS occur only in 2016. QMD and SDIsum occur in later vintages.
