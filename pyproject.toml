[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treemap-portolan-ingest"
version = "0.1.0"
description = "Reproducible TreeMap inventory and Portolan ingest tooling"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
	"GDAL==3.11.4",
	"portolan-cli==0.8.0",
	"pyarrow>=20,<26",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
treemap-ingest = "treemap_portolan_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
